name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  # all target branches, so stacked PRs (base = another PR's branch) get CI too
  pull_request:

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run tests
        run: mvn --batch-mode test

      # MockBukkit turns UnimplementedOperationException into a *skipped* test.
      # A skipped test verifies nothing, so treat it as a failure.
      - name: Fail on skipped tests
        if: ${{ !cancelled() }}
        run: |
          skipped=$(grep -l '<testsuite [^>]*skipped="[1-9]' target/surefire-reports/TEST-*.xml || true)
          if [ -n "$skipped" ]; then
            echo "::error::Skipped tests found in: $skipped"
            exit 1
          fi

      # Each analysis step runs even if a previous one failed, so all reports are produced.
      - name: Checkstyle (fails on any violation)
        if: ${{ !cancelled() }}
        run: mvn --batch-mode checkstyle:check

      - name: SpotBugs (fails on HIGH findings)
        if: ${{ !cancelled() }}
        run: mvn --batch-mode spotbugs:check

      - name: PMD (fails on violations and processing errors)
        if: ${{ !cancelled() }}
        run: mvn --batch-mode pmd:check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml
          if-no-files-found: ignore

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore
